<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<title>IHMA Autofill</title>
<style>
  :root { color-scheme: light dark; }
  body {
    width: 380px;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    font-size: 13px;
    padding: 12px;
    margin: 0;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 10px;
  }
  #detected {
    margin-bottom: 8px;
    padding: 6px 8px;
    border-radius: 4px;
    background: color-mix(in srgb, currentColor 8%, transparent);
  }
  #detected .id {
    font-weight: 600;
  }
  button {
    width: 100%;
    padding: 8px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  button:disabled {
    cursor: not-allowed;
    opacity: 0.5;
  }
  #status {
    min-height: 18px;
    margin: 6px 0;
  }
  #status.error {
    color: #c0392b;
  }
  #status.ok {
    color: #2e7d32;
  }
</style>
</head>
<body>
  <h1>IHMA &mdash; Reestr xat formasini to'ldirish</h1>

  <div id="detected">Aniqlanmoqda...</div>
  <button id="fillBtn" disabled>To'ldirish</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
